{{- range $name, $svc := .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/part-of: mini-shop
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: # maxSurge 0 = no extra pods during upgrade (protects the 8 GB budget)
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        app.kubernetes.io/part-of: mini-shop
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $svc.port | default 8000 | quote }}
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ $svc.port | default 8000 }}
          env:
            - name: SERVICE
              value: {{ $name | quote }}
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mini-shop-admin
                  key: token
            {{- if $.Values.otelEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $.Values.otelEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ $name | quote }}
            {{- end }}
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ $svc.port | default 8000 }}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ $svc.port | default 8000 }}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
{{ toYaml $.Values.resources | indent 12 }}
---
{{- end }}
