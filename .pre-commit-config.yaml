repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Secret scanning runs in CI (gitleaks-action on Linux) — the local Go-build
  # hook is flaky on Windows. See .github/workflows/ci.yml.

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-yaml
        exclude: ^(shop/helm|helm)/.*/templates/  # Helm templates aren't plain YAML
