# Minimal Alertmanager: routes firing alerts to the Incident Copilot API webhook.
# The API runs on the laptop; in-cluster it is reached at host.k3d.internal:8000.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: observability
data:
  alertmanager.yml: |
    route:
      receiver: copilot
      group_by: [alertname, service]
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 5m
    receivers:
      - name: copilot
        webhook_configs:
          - url: http://host.k3d.internal:8000/alerts
            send_resolved: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels: { app: alertmanager }
  template:
    metadata:
      labels: { app: alertmanager }
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
          ports:
            - containerPort: 9093
          volumeMounts:
            - { name: config, mountPath: /etc/alertmanager }
          resources:
            requests: { memory: "32Mi", cpu: "10m" }
            limits: { memory: "80Mi", cpu: "100m" }
      volumes:
        - name: config
          configMap: { name: alertmanager-config }
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: observability
spec:
  selector: { app: alertmanager }
  ports:
    - port: 9093
      targetPort: 9093
