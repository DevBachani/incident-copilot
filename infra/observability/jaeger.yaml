# Jaeger all-in-one, in-memory with a trace cap (RAM-friendly).
# Shop services send OTLP traces here directly (no separate Collector).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels: { app: jaeger }
  template:
    metadata:
      labels: { app: jaeger }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          env:
            - { name: COLLECTOR_OTLP_ENABLED, value: "true" }
            - { name: SPAN_STORAGE_TYPE, value: "memory" }
            - { name: MEMORY_MAX_TRACES, value: "5000" }
          ports:
            - { containerPort: 16686 } # UI
            - { containerPort: 4318 }  # OTLP HTTP
            - { containerPort: 4317 }  # OTLP gRPC
          resources:
            requests: { memory: "96Mi", cpu: "25m" }
            limits: { memory: "300Mi", cpu: "400m" }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: observability
spec:
  type: NodePort
  selector: { app: jaeger }
  ports:
    - { name: ui, port: 16686, targetPort: 16686, nodePort: 30686 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
